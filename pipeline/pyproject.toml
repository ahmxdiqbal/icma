[project]
name = "icma"
version = "0.1.0"
description = "Hadith corpus ingestion, isnad bundle construction, and ICMA pipeline"
requires-python = ">=3.13"
dependencies = ["anthropic>=1.13", "pydantic>=2.14"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic text legitimately contains "confusable" characters

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
